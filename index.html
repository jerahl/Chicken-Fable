<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fdf6f0">
<title>A Little Adventure</title>
<style>
  /* ============================================================
     iPhone-first styling. Uses safe-area insets and dvh so the
     layout sits correctly under the notch and above the home bar.
     ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg-1: #fdf6f0;
    --bg-2: #fbe8e4;
    --bg-3: #f6d5d3;
    --ink: #4a2c35;
    --ink-soft: #8a626e;
    --rose: #c94f6d;
    --rose-deep: #a83b57;
    --gold: #c9a15a;
    --card: rgba(255, 255, 255, 0.82);
    --shadow: 0 10px 30px rgba(168, 59, 87, 0.16);
  }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
  }

  #app {
    position: relative;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 24px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* Floating background hearts */
  .bg-heart {
    position: fixed;
    font-size: 22px;
    opacity: 0;
    pointer-events: none;
    animation: floatUp linear forwards;
    z-index: 0;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
    12%  { opacity: 0.35; }
    85%  { opacity: 0.25; }
    100% { transform: translateY(-110dvh) rotate(28deg) scale(1.15); opacity: 0; }
  }

  .screen {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    text-align: center;
    animation: fadeSlideIn 0.55s ease both;
  }
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .screen.leaving {
    animation: fadeSlideOut 0.35s ease both;
  }
  @keyframes fadeSlideOut {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(-18px); }
  }

  .script {
    font-family: "Snell Roundhand", "Savoye LET", "Apple Chancery", cursive;
    color: var(--rose-deep);
  }

  h1.script { font-size: 44px; font-weight: 400; line-height: 1.15; margin-bottom: 6px; }
  h2.script { font-size: 34px; font-weight: 400; line-height: 1.2; }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 14px;
  }

  .card {
    background: var(--card);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 30px 24px;
    margin-top: 18px;
  }

  .clue-text {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 20px;
    line-height: 1.55;
    color: var(--ink);
    font-style: italic;
    white-space: pre-line;
  }

  .lead {
    font-size: 17px;
    line-height: 1.6;
    color: var(--ink-soft);
  }

  /* Progress hearts */
  .progress {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 20px 0 4px;
    font-size: 18px;
  }
  .progress span { opacity: 0.28; transition: all 0.4s ease; filter: grayscale(60%); }
  .progress span.done { opacity: 1; filter: none; transform: scale(1.12); }
  .progress span.current { opacity: 0.75; filter: none; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.25); }
  }

  /* Inputs & buttons — 16px+ font so iOS Safari never auto-zooms */
  .code-row { display: flex; gap: 10px; margin-top: 22px; }
  input.code {
    flex: 1;
    min-width: 0;
    font-size: 17px;
    padding: 15px 16px;
    border-radius: 16px;
    border: 1.5px solid rgba(201, 79, 109, 0.35);
    background: rgba(255, 255, 255, 0.9);
    color: var(--ink);
    text-align: center;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input.code:focus {
    border-color: var(--rose);
    box-shadow: 0 0 0 4px rgba(201, 79, 109, 0.12);
  }
  input.code::placeholder { letter-spacing: 0.02em; text-transform: none; color: #c9a4ad; }

  .btn {
    display: inline-block;
    font-size: 17px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, var(--rose) 0%, var(--rose-deep) 100%);
    border: none;
    border-radius: 999px;
    padding: 16px 34px;
    box-shadow: 0 8px 22px rgba(168, 59, 87, 0.35);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    -webkit-appearance: none;
    appearance: none;
  }
  .btn:active { transform: scale(0.96); box-shadow: 0 4px 12px rgba(168, 59, 87, 0.3); }
  .btn.block { width: 100%; margin-top: 14px; }
  .btn.ghost {
    background: transparent;
    color: var(--rose-deep);
    box-shadow: none;
    border: 1.5px solid rgba(201, 79, 109, 0.4);
    font-weight: 500;
  }
  .btn.big { font-size: 20px; padding: 19px 46px; }

  .hint-btn {
    background: none;
    border: none;
    color: var(--gold);
    font-size: 15px;
    font-weight: 600;
    margin-top: 18px;
    cursor: pointer;
    -webkit-appearance: none;
  }
  .hint-text {
    margin-top: 12px;
    font-size: 15px;
    color: var(--ink-soft);
    line-height: 1.5;
    animation: fadeSlideIn 0.4s ease both;
  }

  .shake { animation: shake 0.45s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-9px); }
    40% { transform: translateX(9px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }
  .wrong-msg {
    margin-top: 12px;
    font-size: 14px;
    color: var(--rose-deep);
    animation: fadeSlideIn 0.3s ease both;
  }

  .stop-emoji { font-size: 52px; margin-bottom: 10px; display: block; animation: bounceIn 0.6s ease both; }
  @keyframes bounceIn {
    0% { transform: scale(0.3); opacity: 0; }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }

  /* Unlock interstitial */
  .unlock-check {
    font-size: 74px;
    animation: bounceIn 0.7s ease both;
    display: block;
    margin-bottom: 12px;
  }

  /* Proposal buildup lines */
  .buildup-line {
    font-family: Georgia, serif;
    font-size: 23px;
    line-height: 1.55;
    color: var(--ink);
    opacity: 0;
    animation: fadeSlideIn 1.1s ease forwards;
    margin: 14px 0;
  }

  .proposal-title {
    font-family: "Snell Roundhand", "Apple Chancery", cursive;
    font-size: 54px;
    line-height: 1.15;
    color: var(--rose-deep);
    animation: bounceIn 0.9s ease both;
    margin: 10px 0 26px;
  }

  .yes-row { display: flex; flex-direction: column; gap: 14px; align-items: center; margin-top: 10px; }

  .celebrate-names {
    font-family: "Snell Roundhand", "Apple Chancery", cursive;
    font-size: 40px;
    color: var(--rose-deep);
    margin: 14px 0 6px;
  }

  .footer-heart {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom) + 8px);
    left: 50%;
    transform: translateX(-50%);
    font-size: 15px;
    opacity: 0.45;
    z-index: 2;
    user-select: none;
    -webkit-user-select: none;
  }

  canvas#confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
  }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div id="app"></div>
<div class="footer-heart" id="resetHeart">made with ♥</div>

<script>
/* ================================================================
   ✏️  EDIT THIS SECTION — everything personal lives here.
   ================================================================
   HOW IT WORKS
   - Each "stop" is a real-world location on your scavenger hunt.
   - Write a clue that leads her to that spot.
   - At each spot, hide a card/note with that stop's CODE word on it
     (or have a friend there to tell her the word).
   - She types the code into the app to unlock the next clue.
   - After the last stop, the app plays the proposal sequence —
     so make the final stop wherever YOU are waiting with the ring.

   TESTING TIP
   - Tap the "made with ♥" text at the bottom 5 times fast to reset
     progress so you can rehearse the whole flow.
   ================================================================ */
const CONFIG = {
  herName: "My Love",           // Her name, e.g. "Emily"
  yourName: "Me",               // Your name, e.g. "Sam"

  introTitle: "A Little Adventure",
  introMessage: "I've hidden a trail of clues in the places that\nmean the most to us. Follow them one by one —\nsomething special is waiting at the end.",
  startButton: "Begin ♥",

  // Add, remove, or reorder stops freely — the app adapts.
  stops: [
    {
      emoji: "☕️",
      title: "Where It Began",
      clue: "Go to the place where we had our very first date,\nand I was too nervous to finish my coffee.",
      hint: "You ordered a caramel latte. I still remember.",
      code: "SPARK",        // the word hidden at this location
    },
    {
      emoji: "🌳",
      title: "Our Sunday Spot",
      clue: "Find the bench where we watched the sunset\nand talked until the streetlights came on.",
      hint: "It's under the big oak tree in the park.",
      code: "SUNSET",
    },
    {
      emoji: "🍝",
      title: "Table for Two",
      clue: "Head to the restaurant where we celebrated\nyour big news — and split the tiramisu.",
      hint: "You know the one. Ask the host for a note with your name on it.",
      code: "AMORE",
    },
    {
      emoji: "🎶",
      title: "Our Song",
      clue: "Go where we danced in the kitchen at 2am\nto a song we both pretended to know the words to.",
      hint: "Home. Check by the record player.",
      code: "DANCE",
    },
    {
      emoji: "💫",
      title: "The Last Clue",
      clue: "One more stop. Come find me where the city\nlooks its best — I'll be waiting for you.",
      hint: "Look up. I'm at our overlook.",
      code: "FOREVER",
    },
  ],

  // Shown one line at a time before the big question.
  buildupLines: [
    "You found every clue.",
    "Every place we've been, every memory we've made —",
    "they were all leading here.",
    "I have one last question…",
  ],

  proposalQuestion: "Will you marry me?",
  yesButton: "YES! 💍",
  yesButtonAlt: "Absolutely yes ♥",

  celebrationTitle: "She said yes!",
  celebrationMessage: "This is just the beginning.\nNow come here so I can put this ring on you. ♥",
};
/* ================================================================
   End of editable section. Code below runs the experience.
   ================================================================ */

const app = document.getElementById("app");
const STORAGE_KEY = "proposal_hunt_progress";

function getProgress() {
  const v = parseInt(localStorage.getItem(STORAGE_KEY) || "-1", 10);
  return Number.isNaN(v) ? -1 : v; // -1 = intro not passed; 0..n = current stop; n+1 = proposal
}
function setProgress(v) { localStorage.setItem(STORAGE_KEY, String(v)); }

function normalize(s) { return s.trim().toUpperCase().replace(/\s+/g, " "); }

/* ---------- screen transitions ---------- */
function render(html, opts = {}) {
  const old = app.querySelector(".screen");
  const swap = () => {
    app.innerHTML = `<div class="screen">${html}</div>`;
    if (opts.onMount) opts.onMount(app.querySelector(".screen"));
  };
  if (old) {
    old.classList.add("leaving");
    setTimeout(swap, 320);
  } else {
    swap();
  }
}

function progressHearts(current) {
  const n = CONFIG.stops.length;
  let out = '<div class="progress">';
  for (let i = 0; i < n; i++) {
    const cls = i < current ? "done" : i === current ? "current" : "";
    out += `<span class="${cls}">${i < current ? "❤️" : "🤍"}</span>`;
  }
  return out + "</div>";
}

/* ---------- screens ---------- */
function showIntro() {
  render(`
    <div class="eyebrow">For ${escapeHtml(CONFIG.herName)}</div>
    <h1 class="script">${escapeHtml(CONFIG.introTitle)}</h1>
    <div class="card">
      <p class="clue-text">${escapeHtml(CONFIG.introMessage)}</p>
      <button class="btn block" id="startBtn">${escapeHtml(CONFIG.startButton)}</button>
    </div>
  `, {
    onMount(el) {
      el.querySelector("#startBtn").addEventListener("click", () => {
        setProgress(0);
        showStop(0);
      });
    }
  });
}

function showStop(i) {
  const stop = CONFIG.stops[i];
  render(`
    ${progressHearts(i)}
    <div class="eyebrow">Clue ${i + 1} of ${CONFIG.stops.length}</div>
    <span class="stop-emoji">${stop.emoji}</span>
    <h2 class="script">${escapeHtml(stop.title)}</h2>
    <div class="card">
      <p class="clue-text">${escapeHtml(stop.clue)}</p>
      <div class="code-row">
        <input class="code" id="codeInput" type="text" autocomplete="off" autocapitalize="characters"
               autocorrect="off" spellcheck="false" enterkeyhint="go"
               placeholder="Enter the secret word">
      </div>
      <button class="btn block" id="unlockBtn">Unlock</button>
      <div id="feedback"></div>
      <button class="hint-btn" id="hintBtn">Need a hint?</button>
      <div id="hintBox"></div>
    </div>
  `, {
    onMount(el) {
      const input = el.querySelector("#codeInput");
      const card = el.querySelector(".card");
      const feedback = el.querySelector("#feedback");

      const attempt = () => {
        if (normalize(input.value) === normalize(stop.code)) {
          input.blur();
          const next = i + 1;
          setProgress(next);
          showUnlocked(next);
        } else {
          card.classList.remove("shake");
          void card.offsetWidth; // restart animation
          card.classList.add("shake");
          feedback.innerHTML = `<div class="wrong-msg">Not quite — look a little closer at ${escapeHtml(stop.title.toLowerCase())}. ♥</div>`;
          input.select();
        }
      };

      el.querySelector("#unlockBtn").addEventListener("click", attempt);
      input.addEventListener("keydown", e => { if (e.key === "Enter") attempt(); });
      // Keep the input visible above the iOS keyboard.
      input.addEventListener("focus", () => {
        setTimeout(() => input.scrollIntoView({ block: "center", behavior: "smooth" }), 250);
      });

      el.querySelector("#hintBtn").addEventListener("click", () => {
        el.querySelector("#hintBox").innerHTML = `<div class="hint-text">${escapeHtml(stop.hint)}</div>`;
      });
    }
  });
}

function showUnlocked(next) {
  const last = next >= CONFIG.stops.length;
  burstConfetti(last ? 90 : 36);
  render(`
    ${progressHearts(next)}
    <span class="unlock-check">${last ? "💖" : "🔓"}</span>
    <h2 class="script">${last ? "You made it…" : "Clue unlocked!"}</h2>
    <p class="lead" style="margin-top:10px">${last ? "Take a breath. This next part is important." : "On to the next one, my love."}</p>
    <button class="btn big" id="nextBtn" style="margin-top:26px">${last ? "I'm ready ♥" : "Next clue →"}</button>
  `, {
    onMount(el) {
      el.querySelector("#nextBtn").addEventListener("click", () => {
        if (last) showBuildup();
        else showStop(next);
      });
    }
  });
}

function showBuildup() {
  setProgress(CONFIG.stops.length + 1);
  const lines = CONFIG.buildupLines.map((l, idx) =>
    `<p class="buildup-line" style="animation-delay:${idx * 1.6}s">${escapeHtml(l)}</p>`
  ).join("");
  const totalDelay = CONFIG.buildupLines.length * 1.6 + 0.8;
  render(`
    <div>${lines}</div>
    <div id="bigQuestion" style="opacity:0"></div>
  `, {
    onMount(el) {
      setTimeout(() => {
        const q = el.querySelector("#bigQuestion");
        q.style.opacity = "1";
        q.innerHTML = `
          <div class="proposal-title">${escapeHtml(CONFIG.proposalQuestion)}</div>
          <div class="yes-row">
            <button class="btn big" id="yesBtn">${escapeHtml(CONFIG.yesButton)}</button>
            <button class="btn ghost" id="yesBtn2">${escapeHtml(CONFIG.yesButtonAlt)}</button>
          </div>`;
        startHeartRain();
        const celebrate = () => showCelebration();
        q.querySelector("#yesBtn").addEventListener("click", celebrate);
        q.querySelector("#yesBtn2").addEventListener("click", celebrate);
      }, totalDelay * 1000);
    }
  });
}

function showCelebration() {
  setProgress(CONFIG.stops.length + 2);
  burstConfetti(160);
  setTimeout(() => burstConfetti(120), 900);
  setTimeout(() => burstConfetti(120), 2000);
  render(`
    <span class="unlock-check">💍</span>
    <h1 class="script" style="font-size:52px">${escapeHtml(CONFIG.celebrationTitle)}</h1>
    <div class="celebrate-names">${escapeHtml(CONFIG.herName)} &amp; ${escapeHtml(CONFIG.yourName)}</div>
    <div class="card">
      <p class="clue-text">${escapeHtml(CONFIG.celebrationMessage)}</p>
    </div>
  `);
  startHeartRain();
}

/* ---------- ambience: floating hearts ---------- */
let heartTimer = null;
function spawnHeart() {
  const h = document.createElement("div");
  h.className = "bg-heart";
  h.textContent = ["💗", "💕", "🤍", "💖"][Math.floor(Math.random() * 4)];
  h.style.left = Math.random() * 100 + "vw";
  h.style.bottom = "-30px";
  h.style.fontSize = 14 + Math.random() * 18 + "px";
  h.style.animationDuration = 9 + Math.random() * 8 + "s";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 18000);
}
function startAmbience() {
  if (heartTimer) return;
  spawnHeart();
  heartTimer = setInterval(spawnHeart, 2600);
}
function startHeartRain() {
  for (let i = 0; i < 10; i++) setTimeout(spawnHeart, i * 220);
}

/* ---------- confetti ---------- */
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");
let particles = [];
let confettiRunning = false;

function sizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", sizeCanvas);
sizeCanvas();

const CONFETTI_COLORS = ["#c94f6d", "#e88aa0", "#c9a15a", "#f6d5d3", "#a83b57", "#ffffff"];
function burstConfetti(count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x: innerWidth / 2 + (Math.random() - 0.5) * 120,
      y: innerHeight * 0.35,
      vx: (Math.random() - 0.5) * 11,
      vy: -(Math.random() * 11 + 5),
      size: Math.random() * 7 + 4,
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
      rot: Math.random() * Math.PI * 2,
      vrot: (Math.random() - 0.5) * 0.25,
      shape: Math.random() < 0.18 ? "heart" : "rect",
    });
  }
  if (!confettiRunning) { confettiRunning = true; requestAnimationFrame(tickConfetti); }
}
function tickConfetti() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  particles = particles.filter(p => p.y < innerHeight + 40);
  for (const p of particles) {
    p.vy += 0.32;
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.992;
    p.rot += p.vrot;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    if (p.shape === "heart") {
      ctx.font = p.size * 2 + "px serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("❤️", 0, 0);
    } else {
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.62);
    }
    ctx.restore();
  }
  if (particles.length) requestAnimationFrame(tickConfetti);
  else { confettiRunning = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
}

/* ---------- secret reset: tap the footer 5x fast ---------- */
let taps = [];
document.getElementById("resetHeart").addEventListener("click", () => {
  const now = Date.now();
  taps = taps.filter(t => now - t < 2500);
  taps.push(now);
  if (taps.length >= 5) {
    taps = [];
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }
});

/* ---------- util ---------- */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

/* ---------- boot: resume where she left off ---------- */
startAmbience();
const p = getProgress();
if (p < 0) showIntro();
else if (p < CONFIG.stops.length) showStop(p);
else if (p === CONFIG.stops.length) showUnlocked(p);
else if (p === CONFIG.stops.length + 1) showBuildup();
else showCelebration();
</script>
</body>
</html>
